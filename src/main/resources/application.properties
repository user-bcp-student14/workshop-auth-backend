quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${auth.cors.origins}
quarkus.http.cors.methods=POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
auth.database.url=${AUTH_DB_URL:jdbc:sqlite:./data/workshop.db}
auth.password.cost=${AUTH_PASSWORD_COST:12}
auth.bootstrap.username=${AUTH_BOOTSTRAP_USERNAME:}
auth.bootstrap.password=${AUTH_BOOTSTRAP_PASSWORD:}
auth.token.issuer=${AUTH_TOKEN_ISSUER}
auth.token.audience=${AUTH_TOKEN_AUDIENCE}
auth.token.private-key-path=${AUTH_TOKEN_PRIVATE_KEY_PATH}
auth.cors.origins=${AUTH_CORS_ORIGINS}
